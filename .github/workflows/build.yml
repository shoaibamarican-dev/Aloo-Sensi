name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Get Gradle
        run: |
          for u in https://services.gradle.org/distributions/gradle-8.7-bin.zip https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip; do
            curl -fL --retry 5 --retry-delay 5 -o g.zip "$u" && break
          done
          unzip -q g.zip -d $HOME
      - run: unzip -q AlooSensiPro_AndroidStudio.zip
      - run: cd AlooSensiPro && $HOME/gradle-8.7/bin/gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ALOO-SENSI-APK
          path: AlooSensiPro/app/build/outputs/apk/debug/app-debug.apk
